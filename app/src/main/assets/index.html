<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eduTV</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 60% 80%,#394a5d 0%,#101b29 43%,#060b12 78%);color:#fff;font-family:Arial,sans-serif;overflow:hidden}.app{display:flex;width:100vw;height:100vh}.sidebar{width:22%;padding:5vh 2.5vw;background:linear-gradient(90deg,rgba(3,9,16,.88),rgba(3,9,16,.36));display:flex;flex-direction:column;gap:2vh}.logo{font-size:2.1vw;font-weight:700;letter-spacing:.02em;margin-bottom:7vh}.nav{padding:1.5vh 1.2vw;color:#c5cbd4;border-radius:1vw;font-size:1.25vw}.nav.active{background:#ffffff24;color:#fff}.main{flex:1;position:relative;padding:5vh 4vw}.top{display:flex;justify-content:flex-end;font-size:1.1vw;color:#e1e5ed}.welcome{position:absolute;left:4vw;top:38vh}.welcome h1{font-size:4vw;font-weight:500;margin:0 0 1vh}.welcome p{font-size:1.45vw;color:#c8d0da}.shelf{position:absolute;left:4vw;right:4vw;bottom:9vh}.shelf h2{font-size:1.3vw;font-weight:500;margin-bottom:2.5vh}.cards{display:flex;gap:1vw;overflow:hidden}.card{flex:0 0 11vw;height:13vh;background:#121923d9;border:2px solid #ffffff18;border-radius:1vw;display:grid;place-items:center;font-size:1.25vw;font-weight:700;text-align:center;padding:.5vw}.card.focus,.nav.focus{outline:3px solid #fff;box-shadow:0 0 24px #ffffff66;transform:scale(1.035)}.card.netflix{color:#e50914}.card.youtube{color:#ff4d4d}.card.disney{color:#b9d7ff}.card.prime{color:#9fe5ff}.card.max{color:#d7c9ff}.card.unitv{color:#82c7ff}.qrbox{position:absolute;right:4vw;top:15vh;background:#0a101bd9;padding:1vw;border:1px solid #ffffff33;border-radius:1vw;text-align:center;width:12vw}.qrbox img{width:100%;background:white;padding:.35vw;border-radius:.4vw}.qrbox small{display:block;font-size:.8vw;color:#ccd4df;margin-top:.5vw}.hint{position:absolute;bottom:2vh;right:4vw;color:#a8b1bf;font-size:1vw}
</style></head><body><div class="app"><aside class="sidebar"><div class="logo">eduTV</div><div class="nav active">⌂ &nbsp; Início</div><div class="nav">▦ &nbsp; Aplicativos</div><div class="nav">⌕ &nbsp; Buscar</div><div class="nav">▷ &nbsp; Filmes</div><div class="nav">▤ &nbsp; Séries</div><div class="nav">◉ &nbsp; Canais</div><div class="nav">⚙ &nbsp; Configurações</div></aside><main class="main"><div class="top" id="clock"></div><div class="qrbox" id="qrbox" style="display:none"><img id="qrimage" alt="QR Code do controle remoto"><small>Escaneie para controlar pelo celular</small></div><section class="welcome"><h1>Boa noite.</h1><p>O que você quer assistir hoje?</p></section><section class="shelf"><h2>Seus aplicativos</h2><div class="cards" id="cards"></div></section><div class="hint">Setas para navegar · OK para abrir</div></main></div><script>
const defaults=[['Netflix','netflix'],['YouTube','youtube'],['Disney+','disney'],['Prime Video','prime'],['Max','max'],['UniTV','unitv']];
let apps=defaults.map(([label,style])=>({label,style}));try{if(window.EduFireNative){const installed=JSON.parse(EduFireNative.getApps());const seen=new Set(apps.map(x=>x.label.toLowerCase()));for(const x of installed){if(!seen.has(x.label.toLowerCase())){apps.push({label:x.label,packageName:x.packageName,style:''});seen.add(x.label.toLowerCase())}}}}catch(e){}
try{if(window.EduFireNative){const data=JSON.parse(EduFireNative.getRemoteInfo());if(data.qr){document.getElementById('qrimage').src='data:image/png;base64,'+data.qr;document.getElementById('qrbox').style.display='block'}}}catch(e){} const cards=document.getElementById('cards');apps.forEach((a)=>{const d=document.createElement('div');d.className='card '+a.style;d.textContent=a.label;cards.appendChild(d)});let mode='cards',index=0;const nav=[...document.querySelectorAll('.nav')],items=[...document.querySelectorAll('.card')];function draw(){nav.forEach((e,i)=>e.classList.toggle('focus',mode==='nav'&&i===index));items.forEach((e,i)=>e.classList.toggle('focus',mode==='cards'&&i===index))}function activate(){if(mode==='cards'){const a=apps[index];if(window.EduFireNative)EduFireNative.launch(a.packageName||a.label);else alert('Demonstração: '+a.label)}else if(index===1){mode='cards';index=0;draw()}}document.addEventListener('keydown',e=>{const k=e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','Escape'].includes(k))e.preventDefault();if(k==='ArrowLeft'){if(mode==='cards'&&index===0){mode='nav';index=0}else index=Math.max(0,index-1)}if(k==='ArrowRight'){if(mode==='nav'){mode='cards';index=0}else index=Math.min(items.length-1,index+1)}if(k==='ArrowUp'){if(mode==='cards'){mode='nav';index=0}else index=Math.max(0,index-1)}if(k==='ArrowDown'){if(mode==='nav')index=Math.min(nav.length-1,index+1);else index=Math.min(items.length-1,index+1)}if(k==='Enter')activate();if(k==='Escape'){mode='nav';index=0}draw()});function clock(){document.getElementById('clock').textContent=new Date().toLocaleString('pt-BR',{weekday:'short',hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,30000);draw();
</script></body></html>
